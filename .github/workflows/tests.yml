name: FitQuest automated tests
on:
  push:
  pull_request:
jobs:
  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run achievement regression tests
        run: node --test tests/*.test.cjs
